name: iCloud mail cleanup

on:
  schedule:
    - cron: "*/10 * * * *"   # 10分ごと（GitHubの混雑で遅れることあり）
  workflow_dispatch:          # 手動実行ボタン
    inputs:
      dry_run:
        description: "true=削除せず確認だけ"
        default: "true"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python icloud_cleanup.py
        env:
          ICLOUD_USER: ${{ secrets.ICLOUD_USER }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
